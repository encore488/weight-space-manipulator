<div><b><code>{{hm.tensor}}</code></b> {{hm.region}} · {{hm.rows}}×{{hm.cols}} · max |x| = {{hm.max_abs}} <span class="muted">(blue negative, red positive; hover for values)</span></div>
<div class="scroll"><svg width="{{hm.cols*hm.cell}}" height="{{hm.rows*hm.cell}}" style="display:block;margin-top:8px">{% for i,j,v,x in hm.cells %}{% if x >= 0 %}{% set c = 'rgb(255,%d,%d)'|format((255*(1-x))|int, (255*(1-x))|int) %}{% else %}{% set c = 'rgb(%d,%d,255)'|format((255*(1+x))|int, (255*(1+x))|int) %}{% endif %}<rect x="{{j*hm.cell}}" y="{{i*hm.cell}}" width="{{hm.cell}}" height="{{hm.cell}}" fill="{{c}}"><title>[{{i}},{{j}}] {{'%.4g'|format(v)}}</title></rect>{% endfor %}</svg></div>
