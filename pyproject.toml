[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsp-toolkit"
version = "0.2.0"
description = "Tools that let AI agents (and the humans supervising them) read, diagnose, edit and write neural-network weights directly."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "safetensors>=0.4",
  "mcp>=2.0,<3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
hf = ["transformers>=4.45", "tokenizers>=0.15", "huggingface-hub>=0.23"]
bench = ["pyarrow>=14", "huggingface-hub>=0.23"]
pdf = ["reportlab>=4.0"]
agent = ["anthropic>=2.7"]
video = ["playwright>=1.40", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
wsp = "wsp_toolkit.cli:main"
wsp-mcp = "wsp_toolkit.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["wsp_toolkit*"]

[tool.setuptools.package-data]
wsp_toolkit = ["ui/templates/*.html", "ui/static/*", "ui/static/fonts/*", "site/templates/*.html", "site/templates/*.css", "default_config.toml",
               "data/suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU (skipped by default)",
  "download: needs network / large downloads (skipped by default)",
  "slow: takes more than ~30s on CPU",
]
addopts = "-m 'not gpu and not download' -q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
