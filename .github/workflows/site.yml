name: site
# Builds the public website (re-scoring every leaderboard submission) and deploys it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.wsp_toolkit
          key: wsp-data-${{ hashFiles('wsp_toolkit/fixtures/**', 'wsp_toolkit/core/zoo/**', 'wsp_toolkit/core/challenges.py') }}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e .
      - run: wsp leaderboard site --out _site
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
